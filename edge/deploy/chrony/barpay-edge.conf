# Added to chrony on the edge device's Raspberry Pi 5 only, in /etc/chrony/conf.d/, beside the
# OS's own configuration and its NTS time servers, which it keeps. Not for BarPay's server, whose
# clock is only ever slewed.
#
# The Raspberry Pi 5 has no battery for its clock, so after power comes back the clock starts far
# behind. NTS checks the time server's certificate against that clock, finds it not yet valid,
# and the clock is never set. So the certificate's times are not checked for the first clock
# update after chronyd starts, at boot, and are checked again from the second one on. The
# certificate itself is still checked, and NTS still authenticates every update.
nocerttimecheck 1

# The clock is stepped only in the first 3 updates after chronyd starts, when it is off by more
# than 1 s, and slewed from then on. A makestep in the OS's chrony.conf after the line that reads
# this directory takes the place of this one; it must not allow more steps than this.
makestep 1 3
