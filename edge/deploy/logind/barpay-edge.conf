# Added to systemd-logind on the edge device's Raspberry Pi 5, in /etc/systemd/logind.conf.d/.
#
# The QR reader is a keyboard, and while the edge device does not hold it (at boot, between a
# crash and the restart, just after the reader is plugged in), what it types goes to the console
# of the active virtual terminal. With no login prompt and no shell on any virtual terminal, no
# program reads it there. logind starts a login prompt on a virtual terminal when it is switched
# to (NAutoVTs) and always keeps one on tty6 (ReserveVT): neither is started. The prompt on tty1
# is a separate service, masked as README.md says. Logging in over SSH is not affected.
[Login]
NAutoVTs=0
ReserveVT=0
