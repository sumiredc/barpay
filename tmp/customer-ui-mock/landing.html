<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ようこそ · The Copper Fox</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-app="customer" data-variants='[{"k":"visitor","l":"ログイン前","nav":"none"},{"k":"rate-missing","l":"料金を読めない","nav":"none"},{"k":"member","l":"会員（PayPal 未連携）","nav":"none"},{"k":"member-linked","l":"会員（PayPal 連携済み）","nav":"none"},{"k":"in-visit","l":"来店中","nav":"member"},{"k":"ended-guest","l":"ゲストの来店が終わった","nav":"guest"}]'>

<!-- ログイン前・会員（チェックイン前） -->
<main class="entry" data-v="visitor rate-missing member member-linked">
  <img class="logo" src="logo.svg" alt="">
  <p class="store">The Copper Fox</p>
  <div class="center">
    <button class="chip" type="button" data-sheet="rate-info" data-v="visitor member member-linked"><i data-icon="clock"></i>現在のチャージ料金<i data-icon="chevron-right"></i></button>
    <span class="chip off" data-v="rate-missing"><i data-icon="clock"></i>料金を読み込めません</span>
  </div>

  <div class="actions stack" data-v="visitor rate-missing">
    <a class="button" href="login.html">ログイン</a>
    <a class="button secondary" href="signup.html">会員登録</a>
    <div class="divider">または</div>
    <button class="textbutton" type="button" data-sheet="guest-confirm" style="align-self: center">ゲストで入る<i data-icon="chevron-right"></i></button>
  </div>

  <div class="actions stack" data-v="member member-linked">
    <p class="greeting">こんばんは、Taro さん</p>
    <button class="button" type="button" data-sheet="checkin-confirm">チェックイン</button>
    <a class="textbutton" href="paypal.html?v=unlinked" style="align-self: center" data-v="member"><i data-icon="credit-card"></i>&nbsp;PayPal 未連携<i data-icon="chevron-right"></i></a>
    <form data-go="landing.html?v=visitor" class="center"><button class="textbutton muted" type="submit">ログアウト</button></form>
  </div>
</main>

<!-- 来店中 -->
<main data-v="in-visit">
  <div class="state good"><i data-icon="circle-check"></i><h1>チェックイン済み</h1></div>
</main>

<!-- ゲストの来店が終わった -->
<main data-v="ended-guest">
  <div class="state good"><i data-icon="circle-check"></i><h1>ありがとうございました</h1></div>
  <div class="center"><a class="textbutton" href="receipt.html?v=guest-current">レシートを見る<i data-icon="chevron-right"></i></a></div>
  <div class="cartbar"><button class="button" type="button" data-sheet="done-confirm" style="justify-content: center">完了</button></div>
</main>

<!-- 料金の仕組み -->
<dialog class="sheet" id="rate-info">
  <div class="rate-pair">
    <div><span class="rate-label">チャージ料</span><span class="rate">$12.00<small>/時</small></span></div>
    <div><span class="rate-label">1 回の来店で最大</span><span class="rate">$25.00</span></div>
  </div>
  <ul class="benefits">
    <li><i data-icon="check"></i>滞在時間に応じて加算</li>
    <li><i data-icon="check"></i>店の混み具合で変わる</li>
  </ul>
</dialog>

<!-- 入店の確認：ゲスト -->
<dialog class="sheet" id="guest-confirm">
  <form data-go="menu.html?v=first&amp;toast=checkin">
    <h2>ゲストで入る</h2>
    <div class="rate-pair">
      <div><span class="rate-label">チャージ料</span><span class="rate">$12.00<small>/時</small></span></div>
      <div><span class="rate-label">1 回の来店で最大</span><span class="rate">$25.00</span></div>
    </div>
    <ul class="facts">
      <li>お支払いはレジで</li>
    </ul>
    <div class="stack"><button class="button" type="submit">入店する</button></div>
  </form>
</dialog>

<!-- 入店の確認：会員 -->
<dialog class="sheet" id="checkin-confirm">
  <form data-go="menu.html?v=first&amp;toast=checkin">
    <h2>チェックイン</h2>
    <div class="rate-pair">
      <div><span class="rate-label">チャージ料</span><span class="rate">$12.00<small>/時</small></span></div>
      <div><span class="rate-label">1 回の来店で最大</span><span class="rate">$25.00</span></div>
    </div>
    <div class="stack"><button class="button" type="submit">入店する</button></div>
  </form>
</dialog>

<!-- 完了の確認：ゲスト -->
<dialog class="sheet" id="done-confirm">
  <form data-go="landing.html?v=visitor">
    <h2>完了しますか？</h2>
    <p class="muted">このレシートはもう見られません</p>
    <div class="stack"><button class="button" type="submit">完了する</button></div>
  </form>
</dialog>

<script src="mock.js"></script>
</body>
</html>
