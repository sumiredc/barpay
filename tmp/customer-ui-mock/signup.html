<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会員登録 · The Copper Fox</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-app="customer" data-variants='[{"k":"normal","l":"通常","nav":"none"},{"k":"email","l":"メールの誤り","nav":"none"},{"k":"name","l":"名前の誤り","nav":"none"},{"k":"password","l":"パスワードの誤り","nav":"none"}]'>
<main>
<h1>会員登録</h1>
<ul class="benefits">
  <li><i data-icon="check"></i>PayPal 決済が使える</li>
  <li><i data-icon="check"></i>レシートが残る</li>
  <li data-from="guest"><i data-icon="check"></i>今の来店をそのまま引き継ぐ</li>
</ul>
<form class="form" data-go="landing.html?v=member&amp;toast=welcome" novalidate>
  <label for="name">名前</label>
  <input id="name" name="name" type="text" required maxlength="60" autocomplete="name" data-v="normal email password">
  <input id="name" name="name" type="text" required maxlength="60" autocomplete="name" aria-invalid="true" aria-describedby="name-error" data-v="name">
  <p class="error" id="name-error" data-v="name"><i data-icon="alert"></i>名前を入れてください（60 文字まで）</p>

  <label for="email">メールアドレス</label>
  <input id="email" name="email" type="email" required autocomplete="email" value="taro@example.com" data-v="normal name password">
  <input id="email" name="email" type="email" required autocomplete="email" value="taro@example" aria-invalid="true" aria-describedby="email-error" data-v="email">
  <p class="error" id="email-error" data-v="email"><i data-icon="alert"></i>メールアドレスを正しく入れてください</p>

  <label for="password">パスワード</label>
  <div class="password" data-v="normal email name"><input id="password" name="password" type="password" required minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}" autocomplete="new-password" aria-describedby="password-hint"><button type="button"></button></div>
  <div class="password" data-v="password"><input id="password" name="password" type="password" required minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}" autocomplete="new-password" aria-invalid="true" aria-describedby="password-hint"><button type="button"></button></div>
  <p class="hint" id="password-hint" data-v="normal email name">8 文字以上で、大文字・小文字・数字・記号を含む</p>
  <p class="error" data-v="password"><i data-icon="alert"></i>8 文字以上で、大文字・小文字・数字・記号を含めてください</p>

  <div class="cartbar"><button class="button" type="submit" style="justify-content: center">アカウントを作る</button></div>
</form>
<p class="switch">会員の方は <a href="login.html">ログイン</a></p>
</main>
<script src="mock.js"></script>
</body>
</html>
