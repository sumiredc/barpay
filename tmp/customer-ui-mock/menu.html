<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>メニュー · The Copper Fox</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-app="customer" data-variants='[{"k":"active","l":"注文できる（注文したことがある）","nav":"member"},{"k":"first","l":"注文できる（まだ注文していない）","nav":"member"},{"k":"cart","l":"カートに品がある","nav":"member"},{"k":"cart-first","l":"カートに品がある（最初の注文）","nav":"member"},{"k":"pending","l":"前の注文が未確定","nav":"member"},{"k":"closed","l":"注文を受け付けない（レジ待ち）","nav":"guest"},{"k":"not-active","l":"誤り：来店が注文を受け付けない","nav":"member"},{"k":"failed","l":"誤り：そのほか","nav":"member"},{"k":"expired","l":"誤り：画面の期限切れ","nav":"member"}]'>
<main>
<p class="notice bad" role="alert" data-v="not-active"><i data-icon="alert"></i>この来店ではもう注文できません。スタッフにお声がけください</p>
<p class="notice bad" role="alert" data-v="failed"><i data-icon="alert"></i>注文できませんでした。スタッフにお声がけください</p>
<p class="notice info" role="status" data-v="expired"><i data-icon="info"></i>もう一度選んでください</p>

<!-- 前の注文が未確定：アプリと同じく、メニューは出さない -->
<div data-v="pending">
  <p class="notice bad" role="alert"><i data-icon="alert"></i>前の注文が未確定です</p>
  <ul class="lines">
    <li><span>生ビール ×2</span></li>
    <li><span>枝豆 ×1</span></li>
  </ul>
  <form data-go="panel.html?toast=ordered" class="cartbar"><button class="button" type="submit" style="justify-content: center"><i data-icon="rotate-cw"></i> もう一度送る</button></form>
</div>

<!-- 注文を受け付けない -->
<div class="state" data-v="closed">
  <i data-icon="lock"></i>
  <h1>注文を受け付けていません</h1>
  <p><span class="pill at_register">レジ待ち</span></p>
</div>

<div class="menu" data-v="active first cart cart-first not-active failed expired">
  <h2>ドリンク</h2>
  <ul>
    <li><button type="button" data-id="beer"></button></li>
    <li><button type="button" data-id="highball"></button></li>
    <li><button type="button" data-id="gin"></button></li>
    <li><button type="button" data-id="soda"></button></li>
  </ul>
  <h2>フード</h2>
  <ul>
    <li><button type="button" data-id="fries"></button></li>
    <li><button type="button" data-id="edamame"></button></li>
    <li><button type="button" data-id="karaage"></button></li>
  </ul>
</div>

<div class="cartbar" hidden><button class="button" type="button" id="open-confirm"><span>注文を確認</span><span id="cart-sum"></span></button></div>

<!-- 品目：数量とオプションを選ぶ -->
<dialog class="sheet" id="item">
  <form id="item-form">
    <img class="item-photo" id="item-photo" alt="">
    <h2 id="item-name"></h2>
    <p class="muted" id="item-price"></p>
    <div id="item-options"></div>
    <div class="stepper">
      <button type="button" class="step" id="item-minus" aria-label="1 つ減らす"><i data-icon="minus"></i></button>
      <output id="item-qty" aria-live="polite">1</output>
      <button type="button" class="step" id="item-plus" aria-label="1 つ増やす"><i data-icon="plus"></i></button>
    </div>
    <div class="stack">
      <button class="button" type="submit" id="item-submit"></button>
      <button class="textbutton muted" type="button" id="item-remove" hidden style="align-self: center">カートから外す</button>
    </div>
  </form>
</dialog>

<!-- 注文の確認 -->
<dialog class="sheet" id="confirm">
  <form data-go="panel.html?toast=ordered">
    <h2>注文の確認</h2>
    <ul class="lines" id="confirm-lines"></ul>
    <div class="stack"><button class="button" type="submit">注文する</button></div>
  </form>
</dialog>
</main>
<script src="mock.js"></script>
<script>
  // カート。品目を押すとシートで数量とオプションを選び、カートに入れる。
  // 同じ品でもオプションが違えば別の行になる。確認シートの行を押すと、その行を直せる
  (function () {
    const menu = document.querySelector(".menu");
    if (!menu) return;
    const ITEMS = {
      beer: { name: "生ビール", price: 7, options: [{ label: "サイズ", choices: [["グラス", 0], ["パイント", 2]] }] },
      highball: { name: "ウイスキーハイボール", price: 8, options: [{ label: "濃さ", choices: [["ふつう", 0], ["濃いめ", 1]] }] },
      gin: { name: "ジントニック", price: 9, options: [] },
      soda: { name: "ジンジャーエール", price: 4, options: [] },
      fries: { name: "フライドポテト", price: 6, options: [{ label: "ソース", choices: [["ケチャップ", 0], ["マヨネーズ", 0]] }] },
      edamame: { name: "枝豆", price: 5, options: [] },
      karaage: { name: "唐揚げ", price: 9.5, options: [{ label: "量", choices: [["5 個", 0], ["8 個", 3]] }] },
    };
    const money = (n) => `$${n.toFixed(2)}`;
    const params = new URLSearchParams(location.search);
    const v = params.get("v");
    // カートの行：{ id, picks: [選んだ番号…], qty }
    let cart = (v === "cart" || v === "cart-first")
      ? [{ id: "highball", picks: [0], qty: 2 }, { id: "beer", picks: [1], qty: 1 }] : [];
    const unit = (id, picks) => ITEMS[id].price + ITEMS[id].options.reduce((s, o, i) => s + o.choices[picks[i]][1], 0);
    const optText = (id, picks) => ITEMS[id].options.map((o, i) => o.choices[picks[i]][0]).join("・");

    const renderMenu = () => {
      menu.querySelectorAll("button[data-id]").forEach((b) => {
        const it = ITEMS[b.dataset.id];
        const n = cart.filter((l) => l.id === b.dataset.id).reduce((s, l) => s + l.qty, 0);
        b.innerHTML = `<img class="thumb" src="img/${b.dataset.id}.svg" alt=""><span class="name">${it.name}</span><span class="price">${money(it.price)}</span>` +
          (n ? `<span class="count" aria-label="カートに ${n}">${n}</span>` : "");
      });
      const count = cart.reduce((s, l) => s + l.qty, 0);
      const sum = cart.reduce((s, l) => s + l.qty * unit(l.id, l.picks), 0);
      document.querySelector(".cartbar").hidden = count === 0;
      document.body.classList.toggle("has-cart", count > 0);
      document.getElementById("cart-sum").textContent = `${count} 点 · ${money(sum)}`;
      document.getElementById("confirm-lines").innerHTML = cart.map((l, i) =>
        `<li><button type="button" data-line="${i}"><span>${ITEMS[l.id].name} ×${l.qty}` +
        (ITEMS[l.id].options.length ? `<small>${optText(l.id, l.picks)}</small>` : "") +
        `</span><span>${money(l.qty * unit(l.id, l.picks))}</span></button></li>`).join("") +
        `<li class="total"><span>合計</span><span>${money(sum)}</span></li>`;
    };

    // 品目のシート
    const sheet = document.getElementById("item");
    const confirm = document.getElementById("confirm");
    // 2 回目からの注文は、伝票の画面に移って、加算が止まったことと残り時間を出す（最初の注文では止まらない）
    if (v !== "first" && v !== "cart-first") confirm.querySelector("form").dataset.go = "panel.html?v=paused&toast=ordered";
    let editing = null, cur = null, backToConfirm = false;
    const renderSheet = () => {
      const it = ITEMS[cur.id];
      document.getElementById("item-qty").textContent = cur.qty;
      document.getElementById("item-minus").disabled = cur.qty <= 1;
      document.getElementById("item-submit").textContent =
        `${editing === null ? "カートに入れる" : "変更"}　${money(cur.qty * unit(cur.id, cur.picks))}`;
      document.getElementById("item-options").innerHTML = it.options.map((o, i) =>
        `<fieldset class="choices"><legend>${o.label}</legend>` + o.choices.map(([l, p], j) =>
          `<label><input type="radio" name="opt${i}" value="${j}"${cur.picks[i] === j ? " checked" : ""}><span>${l}${p ? ` +${money(p)}` : ""}</span></label>`).join("") +
        `</fieldset>`).join("");
    };
    const openItem = (id, line) => {
      editing = line;
      cur = line === null ? { id, picks: ITEMS[id].options.map(() => 0), qty: 1 } : { ...cart[line], picks: [...cart[line].picks] };
      document.getElementById("item-photo").src = `img/${cur.id}.svg`;
      document.getElementById("item-name").textContent = ITEMS[cur.id].name;
      document.getElementById("item-price").textContent = money(ITEMS[cur.id].price);
      document.getElementById("item-remove").hidden = line === null;
      renderSheet();
      sheet.showModal();
    };
    menu.addEventListener("click", (e) => {
      const b = e.target.closest("button[data-id]");
      if (b) { backToConfirm = false; openItem(b.dataset.id, null); }
    });
    document.getElementById("item-options").addEventListener("change", (e) => {
      cur.picks[Number(e.target.name.slice(3))] = Number(e.target.value);
      renderSheet();
    });
    document.getElementById("item-minus").addEventListener("click", () => { if (cur.qty > 1) { cur.qty--; renderSheet(); } });
    document.getElementById("item-plus").addEventListener("click", () => { if (cur.qty < 99) { cur.qty++; renderSheet(); } });
    const done = () => {
      sheet.close();
      renderMenu();
      if (backToConfirm && cart.length) confirm.showModal();
    };
    document.getElementById("item-form").addEventListener("submit", () => {
      const same = cart.findIndex((l, i) => i !== editing && l.id === cur.id && l.picks.join() === cur.picks.join());
      if (editing !== null) cart.splice(editing, 1, cur); else cart.push(cur);
      if (same !== -1) { // 同じ品と同じオプションの行は 1 つにまとめる
        const keep = cart.indexOf(cur);
        cart[same].qty = Math.min(99, cart[same].qty + cur.qty);
        cart.splice(keep, 1);
      }
      done();
    });
    document.getElementById("item-remove").addEventListener("click", () => { cart.splice(editing, 1); done(); });

    // 確認シート
    document.getElementById("open-confirm").addEventListener("click", () => confirm.showModal());
    document.getElementById("confirm-lines").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-line]");
      if (!b) return;
      confirm.close();
      backToConfirm = true;
      openItem(null, Number(b.dataset.line));
    });

    renderMenu();
    if (params.get("item") && ITEMS[params.get("item")]) openItem(params.get("item"), null);
  })();
</script>
</body>
</html>
