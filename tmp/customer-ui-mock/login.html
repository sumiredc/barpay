<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ログイン · The Copper Fox</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-app="customer" data-variants='[{"k":"normal","l":"通常","nav":"none"},{"k":"wrong","l":"メールかパスワードが違う","nav":"none"},{"k":"taken","l":"登録済みのメールで会員登録した","nav":"none"}]'>
<main>
<h1>ログイン</h1>
<p class="notice info" data-from="guest"><i data-icon="info"></i>今の来店をそのまま引き継ぎます</p>
<p class="notice bad" role="alert" data-v="wrong"><i data-icon="alert"></i>メールかパスワードが違います</p>
<p class="notice info" role="status" data-v="taken"><i data-icon="info"></i>このメールは登録済みです。ログインしてください</p>
<form class="form" data-go="landing.html?v=member">
  <label for="email">メールアドレス</label>
  <input id="email" name="email" type="email" required autocomplete="email" data-v="normal wrong">
  <input id="email" name="email" type="email" required autocomplete="email" value="taro@example.com" data-v="taken">
  <label for="password">パスワード</label>
  <div class="password"><input id="password" name="password" type="password" required autocomplete="current-password"><button type="button"></button></div>
  <div class="cartbar"><button class="button" type="submit" style="justify-content: center">ログイン</button></div>
</form>
<p class="switch">はじめての方は <a href="signup.html">会員登録</a></p>
</main>
<script src="mock.js"></script>
</body>
</html>
