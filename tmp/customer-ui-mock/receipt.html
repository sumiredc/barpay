<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レシート · The Copper Fox</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-app="customer" data-note="本物の画面は、来店が終わるまで 10 秒ごとに読み込み直す。" data-variants='[{"k":"paypal","l":"PayPal で精算（退店直後）","nav":"member"},{"k":"paypal-past","l":"PayPal で精算（過去）","nav":"member"},{"k":"guest-current","l":"レジで精算（ゲスト）","nav":"guest"},{"k":"outside","l":"スタッフと精算","nav":"member"},{"k":"unpaid","l":"未払い","nav":"member"}]'>
<main>

<!-- 退店の直後は、お礼を上に出す -->
<div class="state good" data-v="paypal guest-current">
  <i data-icon="circle-check"></i>
  <h1>ありがとうございました</h1>
</div>

<div class="receipt-head" data-v="paypal-past outside unpaid">
  <h1>11/5（木）20:48 – 22:00</h1>
  <span class="pill closed_unpaid" data-v="unpaid">未払い</span>
</div>

<div class="card bill" data-v="paypal paypal-past guest-current outside unpaid">
  <div class="bill-row"><div>生ビール <span class="muted">× 2</span></div><div>$14.00</div></div>
  <div class="bill-row"><div>枝豆 <span class="muted">× 1</span></div><div>$5.00</div></div>
  <div class="bill-row"><div>ジンジャーエール <span class="muted">× 1</span></div><div>$4.00</div></div>
  <div class="bill-row"><div>チャージ料 <span class="muted">1 時間 12 分</span></div><div>$14.40</div></div>
  <div class="bill-row total"><div>合計</div><div class="bill-amount">$37.40</div></div>
  <div class="bill-row pay-line" data-v="paypal paypal-past"><div><i data-icon="credit-card"></i> PayPal</div><div>$37.40</div></div>
  <div class="bill-row pay-line" data-v="guest-current"><div>レジ</div><div>$37.40</div></div>
  <div class="bill-row pay-line" data-v="outside"><div>スタッフと精算</div><div>$37.40</div></div>
  <div class="bill-row pay-line bad" data-v="unpaid"><div>未払い</div><div>$37.40</div></div>
</div>
<p class="receipt-ids" data-v="paypal paypal-past guest-current outside unpaid">The Copper Fox · 来店 ses_01hx3k9q2m7w8r4t6y5u<span data-v="paypal paypal-past"><br>PayPal 取引 （取引 ID）</span></p>

<!-- 退店の直後：ゲートが開かなかったときだけ QR を出し直せる -->
<div class="center" data-v="paypal"><a class="textbutton" href="exit.html?v=qr"><i data-icon="qr"></i>&nbsp;ゲートが開かないとき</a></div>

<!-- 下：次にすることを 1 つだけ -->
<form class="cartbar" data-go="landing.html?v=member" data-v="paypal"><button class="button" type="submit" style="justify-content: center">完了</button></form>
<div class="cartbar" data-v="guest-current"><button class="button" type="button" data-sheet="done-confirm" style="justify-content: center">完了</button></div>

<!-- ゲストの完了：このレシートはもう見られなくなる -->
<dialog class="sheet" id="done-confirm" data-v="guest-current">
  <form data-go="landing.html?v=visitor">
    <h2>完了しますか？</h2>
    <p class="muted">このレシートはもう見られません</p>
    <div class="stack"><button class="button" type="submit">完了する</button></div>
  </form>
</dialog>
</main>
<script src="mock.js"></script>
</body>
</html>
