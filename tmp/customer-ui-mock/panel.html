<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>伝票 · The Copper Fox</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-app="customer" data-note="本物の画面は、来店が終わるまで 15 秒ごとに読み込み直して、料金と合計を新しくする。" data-variants='[{"k":"active","l":"利用中（会員）","nav":"member"},{"k":"guest","l":"利用中（ゲスト）","nav":"guest"},{"k":"paused","l":"チャージ料が止まっている","nav":"member"},{"k":"checking_out","l":"PayPal で精算中","nav":"member"},{"k":"at_register","l":"レジ待ち","nav":"guest"},{"k":"payment_failed","l":"支払い失敗","nav":"member"},{"k":"closed","l":"精算済み","nav":"member"}]'>
<main>
<!-- 上：今の状態。利用中は合計を大きく出し、精算に進んだあとはその状態を出す -->
<section class="bill-hero" data-v="active guest paused">
  <p class="label">今の合計</p>
  <p class="amount">$37.40</p>
  <p class="muted">滞在 1 時間 12 分</p>
</section>
<p class="notice good" data-v="paused"><i data-icon="gift"></i><span>チャージ料サービス中　あと <strong data-countdown="600">10:00</strong></span></p>

<div class="state" data-v="at_register">
  <i data-icon="credit-card"></i>
  <h1>レジでお支払いください</h1>
</div>
<div class="state" data-v="checking_out">
  <i data-icon="clock"></i>
  <h1>PayPal で支払っています…</h1>
</div>
<div class="state bad" data-v="payment_failed">
  <i data-icon="alert"></i>
  <h1>支払いが通りませんでした</h1>
  <p>スタッフにお声がけください。未払い $37.40</p>
</div>
<div class="state good" data-v="closed">
  <i data-icon="circle-check"></i>
  <h1>ありがとうございました</h1>
  <p>合計 $37.40</p>
</div>

<!-- 内訳 -->
<div class="card bill">
  <div class="bill-row">
    <div>
      <div>チャージ料</div>
      <div class="muted bill-rate" data-v="active guest paused">今 $12.00/時 <span class="up">+$0.50</span>
        <svg class="spark" viewBox="0 0 120 32" role="img" aria-label="チェックインからの 1 時間あたりの料金。$10.50 から $12.00"><path d="M0 28 L14 28 L14 23 L33 23 L33 25 L52 25 L52 17 L70 17 L70 12 L89 12 L89 4 L120 4" fill="none" stroke="#8a4b16" stroke-width="2" stroke-linejoin="round"/></svg>
      </div>
    </div>
    <div class="bill-amount">$13.40</div>
  </div>
  <div class="bill-row">
    <div>注文<span class="muted">（2 回）</span></div>
    <div class="bill-amount">$24.00</div>
  </div>
  <div class="orders">
    <div class="order">
      <div class="order-head"><span class="muted">20:52</span><span>$19.00</span></div>
      <ul><li><span>生ビール</span><span class="muted">× 2</span></li><li><span>枝豆</span><span class="muted">× 1</span></li></ul>
    </div>
    <div class="order">
      <div class="order-head"><span class="muted">21:30</span><span>$5.00</span></div>
      <ul><li><span>ジンジャーエール</span><span class="muted">× 1</span></li></ul>
    </div>
  </div>
  <div class="bill-row total"><div>合計</div><div class="bill-amount">$37.40</div></div>
</div>

<!-- 下：親指の届く位置に、次にすることを 1 つだけ -->
<div class="cartbar" data-v="active guest paused"><button class="button" type="button" data-sheet="pay"><span>支払う</span><span>$37.40</span></button></div>
<div class="cartbar" data-v="closed"><a class="button" href="receipt.html" style="justify-content: center">レシートを見る</a></div>

<!-- 支払い方法を選ぶ。PayPal を連携した会員は退店 QR かレジ、ゲストなどはレジだけ -->
<dialog class="sheet" id="pay">
  <div class="stack" data-v="active paused">
    <a class="button" href="exit.html?v=qr"><i data-icon="qr"></i> PayPal 決済</a>
    <form data-go="panel.html?v=at_register"><button class="button secondary" type="submit">レジで払う</button></form>
  </div>
  <form class="stack" data-go="panel.html?v=at_register" data-v="guest">
    <button class="button" type="submit">レジで払う</button>
  </form>
</dialog>
</main>
<script src="mock.js"></script>
</body>
</html>
