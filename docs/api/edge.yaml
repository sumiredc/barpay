openapi: 3.1.0
info:
  title: BarPay edge device API
  version: 0.1.0
  summary: The calls the edge device makes to BarPay.
  description: |
    The calls the edge device at the exit gate makes to BarPay: exit tokens
    scanned at the gate, the unlocks staff make by hand and how each unlock
    went, and liveliness signals. The development tools that
    stand in for the hardware (virtual exit gate, signal simulator) use the
    same calls with the same shared secret.

    This API is not part of the store app's contract (`openapi.yaml`): the
    edge device and the development tools live in the BarPay repository and
    change with it. Every call needs the edge device's shared secret; the
    store API key and the admin API key are rejected here, and the shared
    secret is rejected everywhere else.

    Behavior is defined in `docs/PRD.md`.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /v1/edge
    description: Relative to the BarPay deployment's base URL. A deployment serves one store.
security:
  - edgeSharedSecret: []

paths:
  /exit-scans:
    post:
      operationId: scanExitToken
      summary: Report an exit QR read at the gate
      description: |
        PRD: UC5; UC6; Guarantees → Unlock only on payment, Single payment;
        Responsibilities → Exit token.

        Send the token read from the exit QR. The answer says whether to
        unlock the gate once and what the reader shows.

        - The current token of an active session linked to PayPal: BarPay
          fixes the final total at this moment, stops the cover charge and
          charges the total once with the member's saved PayPal. `unlock` is
          `true` only after PayPal confirmed the charge (or the total was 0
          and nothing was charged). If the charge fails or is refused, or its
          outcome is unknown (PayPal did not answer in time), the gate stays
          locked and the reader shows `Please see staff` at once; BarPay
          goes on finding out the outcome by itself, and a later success
          closes the session without unlocking.
        - The token of a session closed (charged, or recorded by staff at
          the register or outside BarPay) within the re-unlock window: unlock
          again; nothing is charged. The token stops changing once the
          session's total is fixed.
        - The token of a session without PayPal linked, or waiting at the
          register: locked, `Please pay at the register`.
        - The token of a session checking out, whose payment failed, closed
          longer ago than the re-unlock window, or closed as unpaid: locked,
          `Please see staff`.
        - A token that is unknown or no longer current (an old
          screenshot): locked, `Please show a new QR code`.

        Scans of the same session are handled one at a time: two reads of
        the same QR at once run one checkout, and the second gets the result
        the first left (an unlock again after a success). After every answer
        with `unlock` `true`, report how the unlock went with
        `reportUnlockResult`. The token is never written to logs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRequest'
      responses:
        '200':
          description: What the gate and the reader do.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResult'
        '400':
          description: |
            `invalid_request`: the body is not a `ScanRequest` object, such
            as a token that is empty or longer than 128 characters. Nothing
            is charged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '`unauthorized`: the shared secret is missing or wrong, or another key was sent. Nothing is charged.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /unlocks/next:
    get:
      operationId: waitForUnlock
      summary: Wait for an unlock staff make by hand
      description: |
        PRD: UC7 (staff open the gate by hand); Guarantees → Unlock only on
        payment.

        A long poll: the call waits up to 25 seconds for an unlock that
        staff make through the admin API (`unlockGate` in `openapi.yaml`)
        and answers it, or answers `204` when none came. Call it again as
        soon as it answers. While a call is waiting, the edge device counts
        as connected; when none is waiting, `unlockGate` is refused with
        `gate_unavailable` and nothing is sent later. An unlock answered here
        is not sent again. After unlocking, report how it went with
        `reportUnlockResult`.
      responses:
        '200':
          description: Unlock the gate once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unlock'
        '204':
          description: No unlock came while waiting; call again.
        '401':
          description: '`unauthorized`: the shared secret is missing or wrong, or another key was sent.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /unlocks/{unlock_id}/result:
    parameters:
      - name: unlock_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UnlockId'
    post:
      operationId: reportUnlockResult
      summary: Report whether an unlock worked
      description: |
        PRD: UC5 exception (the charge succeeds but unlocking fails); UC7.

        For an unlock from `scanExitToken` or `waitForUnlock`. A failed
        unlock raises an `unlock_failed` alert. After a scan, whose session
        was paid or settled, the store app is also notified (`gate.unlock_failed`), so
        staff can open the gate by hand; a failed unlock by hand raises the
        alert only, since staff are already at it. The first report of an
        unlock stands: a repeat is answered `204` and changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnlockResult'
      responses:
        '204':
          description: The report was kept, or one was already kept for this unlock.
        '400':
          description: |
            `invalid_request`: the path or the body is malformed;
            `details.field` names it. Nothing is kept.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '`unauthorized`: the shared secret is missing or wrong, or another key was sent. Nothing is kept.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`unlock_not_found`: no unlock has this ID. Nothing is kept.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /signals:
    post:
      operationId: sendSignals
      summary: Send the room's signals
      description: |
        PRD: Pricing model → Signals; Guarantees → Privacy; Fixed
        constraints → Working without hardware.

        Send about every 10 seconds. BarPay keeps the last value it received
        and uses it for 1 minute after receiving it; from exactly 1 minute
        on, evaluations run with no liveliness signal, as without the edge
        device. The time is BarPay's own, when the request arrives.

        Numbers only: a field this schema does not define, or a value that
        is not a number from 0 to 1, is rejected with `400`
        `invalid_request` and `details.field` naming it, and nothing is
        kept. Raw audio never leaves the edge device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Signals'
      responses:
        '204':
          description: The signals were kept.
        '400':
          description: |
            `invalid_request`: the body is not a `Signals` object.
            `details.field` names the first bad field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '`unauthorized`: the shared secret is missing or wrong, or another key was sent. Nothing is kept.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    ScanRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          description: The text read from the exit QR, as read.
          type: string
          minLength: 1
          maxLength: 128
    ScanResult:
      type: object
      additionalProperties: false
      required: [unlock, reader_message]
      properties:
        unlock:
          description: Whether to unlock the gate once now.
          type: boolean
        unlock_id:
          description: Set when `unlock` is `true`; report how the unlock went under it.
          $ref: '#/components/schemas/UnlockId'
        reader_message:
          description: |
            What the reader shows: the edge device shows it through its LED
            and buzzer as the indicator table in `docs/PRD.md` (Fixed
            constraints → Hardware) sets.
          type: string
          enum:
            - Thank you
            - Please pay at the register
            - Please see staff
            - Please show a new QR code
    Unlock:
      type: object
      additionalProperties: false
      required: [unlock_id]
      properties:
        unlock_id:
          $ref: '#/components/schemas/UnlockId'
    UnlockId:
      type: string
      pattern: '^glk_[A-Za-z0-9]{16,32}$'
    UnlockResult:
      type: object
      additionalProperties: false
      required: [unlocked]
      properties:
        unlocked:
          description: Whether the unlock worked, as the PRD's Lock (Hardware in Fixed constraints) judges it; the edge device set the lock's line high and read it back as high.
          type: boolean
    Signals:
      type: object
      additionalProperties: false
      required: [liveliness]
      properties:
        liveliness:
          description: How lively the room sounds, from 0 (quiet) to 1 (loudest), computed on the edge device.
          type: number
          minimum: 0
          maximum: 1
    Error:
      type: object
      description: Every error response; the same shape as in `openapi.yaml`.
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_request, unauthorized, unlock_not_found]
            message:
              description: For developers.
              type: string
            details:
              type: object
              additionalProperties: false
              properties:
                field:
                  type: string
  securitySchemes:
    edgeSharedSecret:
      type: http
      scheme: bearer
      description: |
        PRD: Fixed constraints → Secrets, Working without hardware; Guarantees
        → Access.

        The edge device's shared secret from the config file, sent as
        `Authorization: Bearer <secret>`. It differs from the store API key
        and the admin API key, and passes only under `/v1/edge`.
