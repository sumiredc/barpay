openapi: 3.1.0
info:
  title: BarPay edge device API
  version: 0.1.0
  summary: The calls the edge device makes to BarPay.
  description: |
    The calls the edge device at the exit gate makes to BarPay: exit tokens
    scanned at the gate and liveliness signals. The development tools that
    stand in for the hardware (virtual exit gate, signal simulator) use the
    same calls with the same shared secret.

    This API is not part of the store app's contract (`openapi.yaml`): the
    edge device and the development tools live in the BarPay repository and
    change with it. Every call needs the edge device's shared secret; the
    store API key and the admin API key are rejected here, and the shared
    secret is rejected everywhere else.

    Behavior is defined in `docs/PRD.md`.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /v1/edge
    description: Relative to the BarPay deployment's base URL. A deployment serves one store.
security:
  - edgeSharedSecret: []

paths:
  /signals:
    post:
      operationId: sendSignals
      summary: Send the room's signals
      description: |
        PRD: Pricing model → Signals; Guarantees → Privacy; Fixed
        constraints → Working without hardware.

        Send about every 10 seconds. BarPay keeps the last value it received
        and uses it for 1 minute after receiving it; from exactly 1 minute
        on, evaluations run with no liveliness signal, as without the edge
        device. The time is BarPay's own, when the request arrives.

        Numbers only: a field this schema does not define, or a value that
        is not a number from 0 to 1, is rejected with `400`
        `invalid_request` and `details.field` naming it, and nothing is
        kept. Raw audio never leaves the edge device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Signals'
      responses:
        '204':
          description: The signals were kept.
        '400':
          description: |
            `invalid_request`: the body is not a `Signals` object.
            `details.field` names the first bad field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '`unauthorized`: the shared secret is missing or wrong, or another key was sent. Nothing is kept.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Signals:
      type: object
      additionalProperties: false
      required: [liveliness]
      properties:
        liveliness:
          description: How lively the room sounds, from 0 (quiet) to 1 (loudest), computed on the edge device.
          type: number
          minimum: 0
          maximum: 1
    Error:
      type: object
      description: Every error response; the same shape as in `openapi.yaml`.
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_request, unauthorized]
            message:
              description: For developers.
              type: string
            details:
              type: object
              additionalProperties: false
              properties:
                field:
                  type: string
  securitySchemes:
    edgeSharedSecret:
      type: http
      scheme: bearer
      description: |
        PRD: Fixed constraints → Secrets, Working without hardware; Guarantees
        → Access.

        The edge device's shared secret from the config file, sent as
        `Authorization: Bearer <secret>`. It differs from the store API key
        and the admin API key, and passes only under `/v1/edge`.
