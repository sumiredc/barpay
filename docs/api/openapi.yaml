openapi: 3.1.0
info:
  title: BarPay API
  version: 0.2.0
  summary: The contract between a store's mobile order app and BarPay.
  description: |
    The calls a store app makes to BarPay from its server, the notifications
    BarPay sends back, and the browser redirects of the PayPal link. BarPay
    has no screens: the store app draws the panel, the admin screen and the
    consent before linking from these calls.

    Customer-facing calls use the store API key; admin calls (under `/admin`)
    use the admin API key and name the staff member acting.

    Behavior (pricing, state changes, exception handling) is defined in
    `docs/PRD.md`; each operation and webhook names the use case (UC) or the
    Responsibilities rule it serves.

    The notifications (`webhooks`) are sent to the notification URL in
    BarPay's config file. It uses https; the only exception is http to a
    loopback IP address written as one (`127.0.0.0/8` or `::1`), not to a
    name such as `localhost`. BarPay does not start with any other URL.

    The edge device's API (exit tokens scanned at the gate, liveliness
    signals), which the development tools also use, is not part of this
    contract; it is in `edge.yaml`, under `/v1/edge`, where neither key of
    this contract is accepted.

    Format limits (lengths, patterns, maximums, timeouts) belong to this
    contract, not to the PRD.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /v1
    description: Relative to the BarPay deployment's base URL. A deployment serves one store.
security:
  - storeApiKey: []
tags:
  - name: Sessions
    description: Visits, from check-in to the end of the session.
  - name: Members
    description: A member's saved PayPal.
  - name: Pricing
    description: The published rate and its evaluation.
  - name: Admin
    description: Running the room, for the store app's admin screen.

paths:
  /checkins:
    post:
      tags: [Sessions]
      operationId: createCheckin
      summary: Start a check-in
      description: |
        PRD: UC1; Responsibilities → Check-in.

        Starts a session at once and returns it. The returned session is never
        linked yet: for a member with a saved PayPal, linking is reported later
        by `session.paypal_linked`, or `member.saved_paypal_deleted` if
        PayPal no longer has the saved PayPal. The check tells only that
        PayPal still has it, not that a charge will go through.

        Repeating the call with the same `Idempotency-Key` and the same body
        returns the original response.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckinRequest'
      responses:
        '201':
          description: The session started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: |
            `member_has_open_session`: the member already has a session that
            is not closed. `idempotency_key_reused`: the key was used with a
            different request. `idempotency_key_in_progress`: a request with the
            same key is still being processed; retry shortly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Sessions]
      operationId: getSession
      summary: Read a session
      description: |
        PRD: Responsibilities → Lookup, Panel.

        Returns the current state, totals, payment method and, once the
        session has ended, its receipt. Use it to draw the panel, to confirm
        a result and to recover missed notifications. The rate over the visit
        comes from `getRateHistory` with `since` set to `checked_in_at`.

        The values come from one consistent state, computed at the instant
        of the request, or at `total_fixed_at` once the total is fixed:
        `rate_per_hour`, `cover_charge` and `total` agree even when a rate is
        published during the request, and a session whose total is fixed
        shows the same values at every later request.
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SessionNotFound'

  /sessions/{session_id}/orders:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Sessions]
      operationId: reportOrder
      summary: Report an order
      description: |
        PRD: UC4.

        Adds an order to the session's running total. `order_id` is the dedup
        key within the session: reporting the same order again records it
        once, does not restart the pause, and returns `200` with the order as
        first recorded, even after the session is no longer active. The same
        order has the same lines in the same order, each with the same name,
        quantity and unit price.

        A request is checked in this order, and the first failure is
        returned: the body (`400`), the session (`404`), an `order_id`
        already recorded (`200`, or `409` `order_conflict`), the currency
        (`422` `currency_mismatch`), the session's state (`409`
        `session_not_active`), the total (`422` `amount_too_large`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '200':
          description: The order was already recorded; nothing changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '201':
          description: The order was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |
            `session_not_found`: no session has this ID. Nothing is recorded,
            and no alert is raised: there is no customer for staff to see to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            `session_not_active`: the session is at the register, checking
            out, payment failed or ended; the order is not recorded and a
            `late_order_rejected` alert is raised for the session, once for
            each such report, a resend included.
            `order_conflict`: the `order_id` was already recorded with
            different lines; the recorded order stays as it was.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            `currency_mismatch`: an amount is not in the store's currency.
            `amount_too_large`: with this order, the session's `total` would
            be above 9,000,000,000,000,000 (see `Total`); the order is not
            recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sessions/{session_id}/register-request:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Sessions]
      operationId: requestRegister
      summary: The customer chooses to pay at the register
      description: |
        PRD: UC6; Responsibilities → Panel.

        Fixes the final total, stops the cover charge, sets the payment
        method to `register` and moves the session to `at_register`; nothing
        is charged. The request cannot be withdrawn. Repeating it for a
        session already at the register returns `200` with the session as it
        is.
      responses:
        '200':
          description: The session is waiting at the register.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: |
            `session_not_active`: the session is checking out, payment failed
            or ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sessions/{session_id}/exit-token:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      tags: [Sessions]
      operationId: getExitToken
      summary: Get the session's current exit token
      description: |
        PRD: UC5; UC6; Responsibilities → Exit token; Guarantees → Access.

        Returns the token to show only to this session's customer as a QR.
        Issued for an active session linked to PayPal, and for a session
        closed (charged, or recorded by staff) within the re-unlock window.
        For an active session it changes at the refresh interval; get a new
        one by `expires_at`. For a closed session it no longer changes, and
        `expires_at` is the end of the re-unlock window. The token works only at the exit
        gate. Do not log it; the response carries `Cache-Control: no-store`.
      responses:
        '200':
          description: The current exit token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExitToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: |
            `exit_token_unavailable`: the session has no PayPal linked, is at
            the register, checking out or payment failed, or closed longer
            ago than the re-unlock window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /rate:
    get:
      tags: [Pricing]
      operationId: getRate
      summary: Read the published rate
      description: |
        PRD: Pricing model; Responsibilities → Lookup.
      responses:
        '200':
          description: The rate published now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatePoint'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /rate/history:
    get:
      tags: [Pricing]
      operationId: getRateHistory
      summary: Read the published rates over a period
      description: |
        PRD: UC3; Responsibilities → Panel.

        The published rates from `since`, oldest first, including the rate
        in effect at `since`, up to the 1,000 most recent. Only rates in the
        store's current currency are returned: after a currency change the
        history starts at the first rate after it, even when `since` is
        earlier. Explanations are not included; they are for the admin
        screen (`listDecisions`).
      parameters:
        - name: since
          in: query
          required: true
          description: |
            Must be from 1677-09-21T00:12:44Z to 2262-04-11T23:47:16Z; a
            missing or malformed value, or one outside that range, is
            rejected with `400` `invalid_request` and `details.field` `since`.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: The rates.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [rates]
                properties:
                  rates:
                    type: array
                    maxItems: 1000
                    items:
                      $ref: '#/components/schemas/RatePoint'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /rate-evaluations:
    post:
      tags: [Pricing]
      operationId: requestRateEvaluation
      summary: Ask BarPay to evaluate the rate
      description: |
        PRD: Pricing model → Evaluation on request, Fallback; Guarantees →
        Price bounds; UC7.

        Call it on the store app's own schedule (the sample app: every
        5 minutes). BarPay runs at most one evaluation at a time and at most
        one per minimum interval: a request that arrives while one is running
        waits for it and gets its result (`evaluated: true`); a request
        sooner than the minimum interval after the last one started (one
        that fell back included) returns the current rate with
        `evaluated: false`; one exactly the minimum interval after it is
        evaluated. The admin screen's "evaluate now" uses this operation
        too.
        If the AI does not answer in time or its answer cannot be read, the
        rate stays as it was and `fallback` says why. The call answers within
        30 seconds.
      responses:
        '200':
          description: The rate after this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateEvaluation'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /members/{member_id}:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    get:
      tags: [Members]
      operationId: getMember
      summary: Read a member's saved PayPal
      description: |
        PRD: Responsibilities → Lookup; UC2; UC9.

        BarPay does not own members; any member ID returns a result, with
        `saved_paypal: null` when BarPay keeps nothing for it.
      responses:
        '200':
          description: The member as BarPay knows it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /members/{member_id}/paypal-link:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    post:
      tags: [Members]
      operationId: createPaypalLink
      summary: Ask for a PayPal link URL
      description: |
        PRD: UC2; Responsibilities → PayPal link; Guarantees → Consent.

        Call it only for a logged-in member, after showing the consent text
        whose version is sent as `consent_version`, with a `state` value that
        the store app binds to that member's browser session. Returns a URL to open as
        a full page, never embedded. BarPay shows no page there: the
        browser is redirected to PayPal, and from PayPal back to `return_url`
        (see the `paypalLinkReturn` callback). Redirects carry
        `Referrer-Policy: no-referrer`. A URL works for 30 minutes, until
        just before `expires_at`; each call returns a new URL, and an earlier
        unused one stops working. Nothing is saved until `confirmPaypalLink`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaypalLinkRequest'
      callbacks:
        paypalLinkReturn:
          '{$request.body#/return_url}':
            get:
              operationId: onPaypalLinkReturn
              summary: The member's browser returns to the store app
              description: |
                PRD: UC2.

                Not a server call: BarPay redirects the member's browser here,
                adding `paypal_link`, `state` and, when PayPal approved,
                `code`. No PayPal token is added. The values are not signed
                and save nothing. The store app must check that `state`
                belongs to this browser's session before calling
                `confirmPaypalLink` with the code and the ID of the member
                logged in to that session; if it does not, it must not
                confirm. The page must remove `code` from the address bar
                (for example with a redirect to a clean URL), send
                `Referrer-Policy: no-referrer`, and not log the query string.
              security: []
              parameters:
                - name: paypal_link
                  in: query
                  required: true
                  schema:
                    $ref: '#/components/schemas/PaypalLinkResult'
                - name: state
                  in: query
                  required: true
                  description: The `state` sent in `createPaypalLink`.
                  schema:
                    $ref: '#/components/schemas/PaypalLinkState'
                - name: code
                  in: query
                  required: false
                  description: Present only with `paypal_link=approved`.
                  schema:
                    $ref: '#/components/schemas/PaypalLinkCode'
              responses:
                '200':
                  description: The store app shows its own screen.
                '400':
                  description: An unknown `paypal_link` value; the store app treats it as `failed`.
      responses:
        '201':
          description: The link URL was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaypalLink'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: |
            `saved_paypal_exists`: the member already has a saved PayPal, or
            its deletion is still pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            `return_url_not_allowed`: `return_url` is not on the store app's
            origin set in the config file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /members/{member_id}/paypal-link/confirm:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    post:
      tags: [Members]
      operationId: confirmPaypalLink
      summary: Confirm a PayPal link
      description: |
        PRD: UC2; Responsibilities → PayPal link; Fixed constraints → Verify
        before trusting.

        `member_id` must be the member logged in to the store app's own
        session, not a value taken from the return URL. BarPay saves PayPal
        only if the code is known, unused, not expired and was issued for a
        link URL made for this member. A code works for 10 minutes from when
        it was issued, until just before that instant, and is used up by the
        first confirm request, whether it succeeds or not.
        On success an active session of the member is linked, and
        `member.paypal_linked` is sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaypalLinkConfirmRequest'
      responses:
        '201':
          description: PayPal was saved for the member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: |
            `saved_paypal_exists`: the member already has a saved PayPal, or
            its deletion is still pending.
            `paypal_account_already_linked`: PayPal returned a saved PayPal
            that BarPay holds for another member, because the member approved
            with a PayPal account already linked to that member. Nothing is
            saved, the other member's saved PayPal is left as it is, and the
            code cannot be used again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            `link_code_invalid`: the code is unknown, already used, expired,
            or was issued for another member. Nothing is saved, and the code
            cannot be used again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: |
            `paypal_save_failed`: PayPal did not save it. Nothing is saved;
            the member can start linking again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /members/{member_id}/saved-paypal:
    parameters:
      - $ref: '#/components/parameters/MemberId'
    delete:
      tags: [Members]
      operationId: deleteSavedPaypal
      summary: Delete a member's saved PayPal
      description: |
        PRD: UC9.

        Deletes the saved PayPal in PayPal. When PayPal confirms within the
        request, the response is `204`. Otherwise it is `202`: BarPay keeps
        retrying, and the member's saved PayPal shows `deletion_pending`; the
        member cannot link again and a check-in starts unlinked. A request
        while the deletion is pending gets `202` again and starts nothing new.
        Either way, `member.saved_paypal_deleted` is sent once PayPal confirms.
      responses:
        '202':
          description: Deletion accepted; PayPal has not confirmed yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |
            `saved_paypal_not_found`: the member has no saved PayPal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            `saved_paypal_in_use`: a session that uses it is not yet closed
            (`details.session_id` names it). Nothing is deleted; the member
            can delete it after paying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/sessions:
    get:
      tags: [Admin]
      operationId: listSessions
      summary: List sessions
      description: |
        PRD: UC7; Responsibilities → Admin.

        Newest check-in first, ended sessions included. Filter by `state` to
        list, for example, the sessions waiting at the register. Each
        session is what `getSession` returns for it at the same instant: its
        total, cover charge and state come from the same computation, and a
        session that reached the 3-day limit is closed unpaid before it is
        listed, as `getSession` does. A session whose state changes while
        the pages are read keeps its place by check-in and is listed on a
        later page only if its state when that page is read matches.
      security:
        - adminApiKey: []
      parameters:
        - $ref: '#/components/parameters/StaffId'
        - name: state
          in: query
          required: false
          description: |
            One or more `SessionState` values separated by commas, such as
            `at_register,payment_failed`; leave it out to list every state.
            Passed more than once, the states of all are listed. A value that
            is empty or not a `SessionState` is rejected with `400`
            `invalid_request` and `details.field` `state`.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/SessionState'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of sessions.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [sessions, next_cursor]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/sessions/{session_id}/close:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Admin]
      operationId: closeSession
      summary: Staff close a linked session
      description: |
        PRD: UC7 (a linked customer left through another door); UC5.

        Checks the session out as in UC5 without the gate: the total is fixed
        and charged once with the saved PayPal. The session moves to
        `checking_out` before PayPal is called, so a concurrent request gets
        `session_not_active`. Once the charge has been attempted, the response
        is kept under the key even if it is an error. The response is the session
        after the attempt (`closed` or `payment_failed`); the result is also
        notified. While the outcome is unknown, the response is the session in
        `checking_out`, and the result comes later by `session.closed` or
        `session.payment_failed`. The same `Idempotency-Key` returns the first
        response, including a `checking_out` one, and never waits or charges
        again.
      security:
        - adminApiKey: []
      parameters:
        - $ref: '#/components/parameters/StaffId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The session after the checkout attempt, or in `checking_out` while its outcome is unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: |
            `session_not_active`: the session is not active.
            `session_not_linked`: it has no PayPal linked; record a register
            payment instead. `idempotency_key_reused`,
            `idempotency_key_in_progress`: as for `createCheckin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/sessions/{session_id}/retry:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Admin]
      operationId: retryCharge
      summary: Staff retry a failed charge
      description: |
        PRD: UC7 exception; Guarantees → Charges only for this visit, Single
        payment.

        Charges the total again with the saved PayPal as a new attempt. It
        keeps the session's `invoice_id`, so it cannot succeed if an earlier
        attempt did (Fixed constraints → Idempotency). The session moves to
        `checking_out` before PayPal is called, so a concurrent request, even with another key, gets
        `session_not_payment_failed`. While the outcome is unknown, the
        response is the session in `checking_out`, and the result comes later
        by `session.closed` or `session.payment_failed`. The same
        `Idempotency-Key` returns the first response, including a
        `checking_out` one, and never waits or charges again; once the charge
        has been attempted, the response is kept under the key even if it is
        an error.
      security:
        - adminApiKey: []
      parameters:
        - $ref: '#/components/parameters/StaffId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The session after the attempt (`closed` or `payment_failed`), or in `checking_out` while its outcome is unknown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: |
            `session_not_payment_failed`: the session is not PaymentFailed.
            `retry_window_over`: it is 3 days or more since checkout began,
            also once the session has been closed as unpaid for it.
            `saved_paypal_not_found`: the member no longer has a saved PayPal
            (PayPal no longer had it); settle outside BarPay instead.
            `idempotency_key_reused`, `idempotency_key_in_progress`: as for
            `createCheckin`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/sessions/{session_id}/register-payment:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Admin]
      operationId: recordRegisterPayment
      summary: Staff record a payment at the register
      description: |
        PRD: UC6 (including a customer who went straight to the register).

        For an active session or one waiting at the register. Fixes the
        total if it is not fixed yet, records the amount taken and closes the
        session; `session.settled_outside` follows. Nothing is charged
        through BarPay. If a retry after a lost response gets `409`, read the
        session: it may already be closed by the first request. From exactly
        3 days after the register was requested, a session waiting there is
        closed as unpaid (PRD: UC6), so the request gets `409`.
      security:
        - adminApiKey: []
      parameters:
        - $ref: '#/components/parameters/StaffId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmountRecordedRequest'
      responses:
        '200':
          description: The session, closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: |
            `session_not_active`: the session is checking out, payment
            failed or ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`currency_mismatch`: the amount is not in the store''s currency.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/sessions/{session_id}/settle-outside:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Admin]
      operationId: settleOutside
      summary: Staff settle a failed charge outside BarPay
      description: |
        PRD: UC7 exception.

        For a PaymentFailed session. Records the amount settled and closes
        the session; `session.settled_outside` follows.
      security:
        - adminApiKey: []
      parameters:
        - $ref: '#/components/parameters/StaffId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmountRecordedRequest'
      responses:
        '200':
          description: The session, closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: '`session_not_payment_failed`: the session is not PaymentFailed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: '`currency_mismatch`: the amount is not in the store''s currency.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/sessions/{session_id}/mark-unpaid:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Admin]
      operationId: markUnpaid
      summary: Staff mark a session at the register as unpaid
      description: |
        PRD: UC6 exception; UC7.

        For a session waiting at the register whose customer left without
        paying. Records the unpaid total and closes the session;
        `session.closed_unpaid` follows. Nothing is charged. From exactly 3
        days after the register was requested, BarPay has closed the session
        as unpaid itself (PRD: UC6), so the request gets `409`.
      security:
        - adminApiKey: []
      parameters:
        - $ref: '#/components/parameters/StaffId'
      responses:
        '200':
          description: The session, closed as unpaid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: '`session_not_at_register`: the session is not waiting at the register.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/gate/unlock:
    post:
      tags: [Admin]
      operationId: unlockGate
      summary: Staff open the exit gate by hand
      description: |
        PRD: Guarantees → Unlock only on payment; UC5 exception; UC7.

        Asks the edge device to unlock once. Recorded with the staff member
        and, if given, the session it is for. The edge device is connected
        while it waits for such an unlock (`edge.yaml`); BarPay hands the
        unlock to it then. With no edge device connected, the request gets
        `gate_unavailable` and nothing is recorded or sent later.
      security:
        - adminApiKey: []
      parameters:
        - $ref: '#/components/parameters/StaffId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                session_id:
                  description: The session the gate is opened for, if any.
                  $ref: '#/components/schemas/SessionId'
      responses:
        '202':
          description: The unlock was sent to the edge device.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '503':
          description: '`gate_unavailable`: no edge device is connected.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/settings:
    get:
      tags: [Admin]
      operationId: getSettings
      summary: Read the settings
      description: |
        PRD: Pricing model; UC7; UC8 postcondition.
      security:
        - adminApiKey: []
      parameters:
        - $ref: '#/components/parameters/StaffId'
      responses:
        '200':
          description: The settings in effect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Admin]
      operationId: updateSettings
      summary: Change the settings
      description: |
        PRD: UC7 alternative flow (staff change a setting); Pricing model →
        Guardrails, Settings changes.

        Replaces all settings. Block length, pause and cap apply to active
        sessions from their next block. A new floor or ceiling that leaves
        the published rate outside moves it to the nearer bound at once and
        records a `range_change` decision with the staff member; one that
        leaves it inside publishes no rate and records nothing.
      security:
        - adminApiKey: []
      parameters:
        - $ref: '#/components/parameters/StaffId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
      responses:
        '200':
          description: The settings now in effect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          description: |
            `invalid_request`: the body does not fit the `Settings` schema
            (a field missing, unknown or given twice, with names compared
            case-sensitively; a value of the wrong type; or a value outside
            the schema's `minimum`, `maximum` or `enum`, such as
            `block_minutes` 0 or a negative amount), or `BarPay-Staff-Id`
            is missing or malformed. `details.field` names the first bad
            field by its path, such as `floor.value`. Nothing changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: |
            `invalid_settings`: the body fits the schema but breaks a rule
            the schema cannot state: `floor` is 0, `floor` is not below
            `ceiling`, `floor` or `ceiling` is not a multiple of the rate
            step, or an amount is not in the store's currency.
            `details.field` names the first bad field. Nothing changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/staff-events:
    post:
      tags: [Admin]
      operationId: sendStaffEvent
      summary: Send a staff event
      description: |
        PRD: Pricing model → Signals; UC7.

        A signal for the next evaluations, such as a live show starting or
        ending. A label stays an input to evaluations from its `starts`
        until an `ends` with the same label (compared exactly).
        `recorded_at` is set by BarPay; a request that sends it is rejected
        with `400`.
      security:
        - adminApiKey: []
      parameters:
        - $ref: '#/components/parameters/StaffId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffEvent'
      responses:
        '201':
          description: The event was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffEvent'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/decisions:
    get:
      tags: [Admin]
      operationId: listDecisions
      summary: Read the decision log
      description: |
        PRD: Pricing model → Explanation, Decision log; UC7.

        Newest first. Each entry is one evaluation, or a floor or ceiling
        change that moved the rate.
      security:
        - adminApiKey: []
      parameters:
        - $ref: '#/components/parameters/StaffId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of decisions.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [decisions, next_cursor]
                properties:
                  decisions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Decision'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/alerts:
    get:
      tags: [Admin]
      operationId: listAlerts
      summary: Read the alerts
      description: |
        PRD: Guarantees → Observability; UC3, UC4, UC5, UC6, UC8, UC9.

        Newest first. Every alert BarPay raised is listed: an alert has no
        acknowledged or resolved state.
      security:
        - adminApiKey: []
      parameters:
        - $ref: '#/components/parameters/StaffId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of alerts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [alerts, next_cursor]
                properties:
                  alerts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Alert'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/notifications:
    get:
      tags: [Admin]
      operationId: listNotifications
      summary: Read the notification log
      description: |
        PRD: Responsibilities → Notifications; UC7.

        Newest first. Shows each notification's delivery status, including
        the ones given up after 24 hours of retries.
      security:
        - adminApiKey: []
      parameters:
        - $ref: '#/components/parameters/StaffId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of notifications.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [notifications, next_cursor]
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationRecord'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

webhooks:
  session.started:
    post:
      operationId: onSessionStarted
      summary: A session started
      description: |
        PRD: UC1; Responsibilities → Notifications.
      security: []
      parameters:
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionStartedEvent'
      responses:
        '2XX':
          $ref: '#/components/responses/Acknowledged'
  session.paypal_linked:
    post:
      operationId: onSessionPaypalLinked
      summary: A session was linked to the member's saved PayPal
      description: |
        PRD: UC1 alternative flow; UC2; Responsibilities → Notifications.
      security: []
      parameters:
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionPaypalLinkedEvent'
      responses:
        '2XX':
          $ref: '#/components/responses/Acknowledged'
  session.register_requested:
    post:
      operationId: onSessionRegisterRequested
      summary: The customer chose to pay at the register
      description: |
        PRD: UC6; Responsibilities → Notifications.

        The total is fixed, the cover charge has stopped and the payment method is `register`.
      security: []
      parameters:
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRegisterRequestedEvent'
      responses:
        '2XX':
          $ref: '#/components/responses/Acknowledged'
  session.closed:
    post:
      operationId: onSessionClosed
      summary: The session was checked out through BarPay
      description: |
        PRD: UC5; UC7 (staff close, retry); Responsibilities → Notifications.

        The total was charged with the saved PayPal, or was 0. Carries the receipt.
        A charge whose outcome was unknown and that later succeeded closes the
        session without unlocking the gate; get its exit token to let the
        customer out within the re-unlock window.
      security: []
      parameters:
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionClosedEvent'
      responses:
        '2XX':
          $ref: '#/components/responses/Acknowledged'
  session.payment_failed:
    post:
      operationId: onSessionPaymentFailed
      summary: The checkout charge failed or could not be confirmed
      description: |
        PRD: UC5; Responsibilities → Notifications.

        The session stays open with `unpaid_amount` set. `data.reason` says
        whether PayPal refused the charge or BarPay could not confirm its
        outcome.
      security: []
      parameters:
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionPaymentFailedEvent'
      responses:
        '2XX':
          $ref: '#/components/responses/Acknowledged'
  session.settled_outside:
    post:
      operationId: onSessionSettledOutside
      summary: Staff recorded a payment taken outside BarPay
      description: |
        PRD: UC6 (register, including a customer who went straight to the
        register); UC7 (settled outside BarPay after a failed charge);
        Responsibilities → Notifications.

        Carries the receipt with `settlement` `register` or `outside`.
      security: []
      parameters:
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionSettledOutsideEvent'
      responses:
        '2XX':
          $ref: '#/components/responses/Acknowledged'
  session.closed_unpaid:
    post:
      operationId: onSessionClosedUnpaid
      summary: The session was closed as unpaid
      description: |
        PRD: UC6; UC7; Responsibilities → Notifications.

        Staff marked it unpaid, or 3 days passed. Carries the receipt with the
        unpaid amount.
      security: []
      parameters:
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionClosedUnpaidEvent'
      responses:
        '2XX':
          $ref: '#/components/responses/Acknowledged'
  gate.unlock_failed:
    post:
      operationId: onGateUnlockFailed
      summary: The session was paid but the exit gate did not unlock
      description: |
        PRD: UC5; Responsibilities → Notifications.

        The payment stands; staff can open the gate by hand (`unlockGate`).
      security: []
      parameters:
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GateUnlockFailedEvent'
      responses:
        '2XX':
          $ref: '#/components/responses/Acknowledged'
  member.paypal_linked:
    post:
      operationId: onMemberPaypalLinked
      summary: A member saved PayPal
      description: |
        PRD: UC2; Responsibilities → Notifications.
      security: []
      parameters:
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberPaypalLinkedEvent'
      responses:
        '2XX':
          $ref: '#/components/responses/Acknowledged'
  member.saved_paypal_deleted:
    post:
      operationId: onMemberSavedPaypalDeleted
      summary: A member's saved PayPal was deleted
      description: |
        PRD: UC9; UC1 exception and UC5 (PayPal no longer has the saved
        PayPal); Responsibilities → Notifications.

        `data.reason` says why.
      security: []
      parameters:
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberSavedPaypalDeletedEvent'
      responses:
        '2XX':
          $ref: '#/components/responses/Acknowledged'

components:
  securitySchemes:
    storeApiKey:
      type: http
      scheme: bearer
      description: |
        PRD: Responsibilities → API keys; Guarantees → Access.

        The store API key from the config file, sent from the store app's
        server as `Authorization: Bearer <key>`. Never send it from a browser.
        It is rejected under `/admin` and under `/v1/edge`.
    adminApiKey:
      type: http
      scheme: bearer
      description: |
        PRD: Responsibilities → API keys, Admin; Guarantees → Access.

        The admin API key from the config file, separate from the store API
        key, sent from the store app's server as `Authorization: Bearer <key>`
        for the operations under `/admin`. The store API key is rejected
        there, and the admin API key is rejected everywhere else.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A unique key chosen by the store app for this request. Keys belong to
        the API key the request is sent with: the store API key and the admin
        API key each have their own, so the same key under the other API key
        is another key.

        BarPay keeps the response to a key for 24 hours from the change it
        answers, up to and including that instant; after that the key is
        forgotten, and a request with it is a new request. The same key with
        the same request returns the original response, its status and body
        unchanged, without running the operation again. The same request is
        the same method, path (with any query), `BarPay-Staff-Id` (for admin
        operations) and body, byte for byte; with any other request (another
        operation, another session, another staff member, another body) the
        key is rejected with `idempotency_key_reused` and nothing runs, so one
        staff member never gets the response to another's request. A
        request whose key is still being processed is rejected with
        `idempotency_key_in_progress`; nothing runs.

        An error response returned after something changed (for example, a
        charge that was attempted and failed) is kept and returned like a
        success. After an error response returned before anything changed,
        nothing is kept, so the same key can be sent again. A request cut off
        by a restart of BarPay before it changed anything keeps nothing
        either.

        The key is checked after the API key and before the body. When it is
        missing or malformed, the request is rejected with `400`
        `invalid_request` and `details.field` `Idempotency-Key`, and nothing
        changes.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9_.:-]+$'
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SessionId'
    MemberId:
      name: member_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/MemberId'
    StaffId:
      name: BarPay-Staff-Id
      in: header
      required: true
      description: |
        PRD: Responsibilities → Admin; UC7 postcondition.

        The store app's ID of the staff member acting, as authenticated by
        the store app. BarPay records it with every change it makes and
        trusts it as sent. Checked after the admin API key: when it is
        missing or malformed, the request is rejected with `400`
        `invalid_request` and `details.field` `BarPay-Staff-Id`, and nothing
        changes.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9_-]+$'
    Limit:
      name: limit
      in: query
      required: false
      description: |
        A value that is not an integer from 1 to 100 is rejected with `400`
        `invalid_request` and `details.field` `limit`.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        PRD: Responsibilities → Admin.

        `next_cursor` from the previous page of the same operation, passed
        unchanged; leave it out for the first page. It is opaque: do not
        build or change one. A cursor that is malformed, comes from another
        operation, or names nothing BarPay listed is rejected with `400`
        `invalid_request` and `details.field` `cursor`.

        Every list (`listSessions`, `listAlerts`, `listNotifications`,
        `listDecisions`) is newest first in the order BarPay stored its
        items (check-in, raising, storing, deciding). That order is the same
        on every read, also among items stored at the same instant. A cursor
        points at the last item of the previous page, not at a count of
        items, and the page continues with the items stored before it. Items
        added meanwhile therefore neither shift the pages nor appear twice
        nor go missing; they are on a new first page.
      schema:
        type: string
        maxLength: 256
    Signature:
      name: BarPay-Signature
      in: header
      required: true
      description: |
        `t=<unix seconds>,v1=<hex>`, where `v1` is HMAC-SHA256 with the store
        app's signing secret over `<t>.<raw request body>`. `t` is the time of
        this delivery attempt: every retry is signed again, while the event's
        `id` stays the same. Verify it with a constant-time comparison against
        the raw body before parsing, and reject a `t` more than 5 minutes from
        the current time.
      schema:
        type: string
        pattern: '^t=[0-9]+,v1=[0-9a-f]{64}$'

  responses:
    Acknowledged:
      description: |
        Any 2xx acknowledges the notification. Anything else, including a
        3xx (redirects are not followed), or no answer within 10 seconds, is
        retried 1 minute, 5 minutes, 30 minutes, 2 hours, 6 hours, 12 hours
        and 24 hours after the first attempt, then given up. Retry times that
        pass before BarPay can send (for example while it is stopped) are
        made up by one attempt; when the last one passed, that attempt is the
        last. The
        same event may arrive more than once or out of order: deduplicate by
        `id` and order by `sequence`.
    InvalidRequest:
      description: |
        `invalid_request`: the body, a parameter or a header is missing or
        malformed (for example a negative amount, or a member ID that is not
        allowed). `details.field` names the first bad field.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: '`unauthorized`: the API key is missing, wrong, or not the key for this operation. Nothing changes.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SessionNotFound:
      description: '`session_not_found`: no session has this ID.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    SessionId:
      type: string
      description: Assigned by BarPay.
      pattern: '^ses_[A-Za-z0-9]{16,32}$'
      examples: [ses_8f3k2m9q1x7v4b6n]
    MemberId:
      type: string
      description: The store app's own member ID. BarPay trusts it as sent.
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9_-]+$'
      examples: [m_1024]
    Currency:
      type: string
      enum: [JPY, USD]
      description: The store's currency, set in the config file.
    Money:
      type: object
      description: |
        An amount as an integer in the currency's smallest unit: yen for JPY
        (no decimals), cents for USD. `{"value": 1250, "currency": "USD"}` is
        $12.50.
      required: [value, currency]
      additionalProperties: false
      properties:
        value:
          type: integer
          minimum: 0
          maximum: 100000000
        currency:
          $ref: '#/components/schemas/Currency'
    Total:
      type: object
      description: |
        A sum, or an amount that may stand for one: an order's amount, a
        session's orders total, cover charge, total and unpaid amount, and
        the amount staff record against a total. The same form as `Money`,
        with a higher maximum, the largest integer a JSON reader keeps
        exactly: the lines of one order can add up to more than `Money`'s
        maximum, and so can a visit. BarPay rejects an order that would
        bring a session's `total` above 9,000,000,000,000,000 (`reportOrder`,
        `amount_too_large`), which leaves room under this maximum for the
        cover charge that accrues afterwards.
      required: [value, currency]
      additionalProperties: false
      properties:
        value:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        currency:
          $ref: '#/components/schemas/Currency'
    SessionState:
      type: string
      description: |
        PRD: the state diagram in Use cases. `active` (Active),
        `checking_out` (CheckingOut), `at_register` (AtRegister),
        `payment_failed` (PaymentFailed), `closed` (Closed),
        `closed_unpaid` (ClosedUnpaid). `closed` covers both a charge through
        BarPay and a payment recorded by staff; `receipt.settlement` tells
        them apart.
      enum: [active, checking_out, at_register, payment_failed, closed, closed_unpaid]
    PaymentMethod:
      type: string
      description: '`paypal` when the session is linked to the member''s saved PayPal and the register was neither requested nor paid at; otherwise `register`.'
      enum: [paypal, register]
    CoverChargeStatus:
      type: string
      description: '`running`, `paused` (an additional order paused it), `capped` (the cap per visit was reached) or `stopped` (the total is fixed). When more than one applies, `stopped` wins, then `capped`, then `paused`.'
      enum: [running, paused, capped, stopped]
    CheckinRequest:
      type: object
      additionalProperties: false
      properties:
        member_id:
          description: Omit for a guest.
          $ref: '#/components/schemas/MemberId'
    Session:
      type: object
      additionalProperties: false
      required:
        - session_id
        - state
        - member_id
        - payment_method
        - checked_in_at
        - rate_per_hour
        - cover_charge_status
        - orders_total
        - cover_charge
        - total
        - order_count
        - unpaid_amount
        - receipt
      properties:
        session_id:
          $ref: '#/components/schemas/SessionId'
        state:
          $ref: '#/components/schemas/SessionState'
        member_id:
          description: '`null` for a guest.'
          oneOf:
            - $ref: '#/components/schemas/MemberId'
            - type: 'null'
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        checked_in_at:
          type: string
          format: date-time
        total_fixed_at:
          description: When the final total was fixed (checkout began, the register was requested, or staff recorded a register payment); absent while active.
          type: string
          format: date-time
        rate_per_hour:
          description: The rate published now; for a session whose total is fixed, the rate at that moment.
          $ref: '#/components/schemas/Money'
        cover_charge_status:
          $ref: '#/components/schemas/CoverChargeStatus'
        orders_total:
          $ref: '#/components/schemas/Total'
        cover_charge:
          description: The sum of the ended blocks' amounts so far.
          $ref: '#/components/schemas/Total'
        total:
          description: '`orders_total` + `cover_charge`.'
          $ref: '#/components/schemas/Total'
        order_count:
          type: integer
          minimum: 0
        unpaid_amount:
          description: |
            The amount BarPay could not confirm as paid. Set while
            `payment_failed` and for `closed_unpaid`; otherwise `null`.
          oneOf:
            - $ref: '#/components/schemas/Total'
            - type: 'null'
        receipt:
          description: Set once the session has ended (`closed` or `closed_unpaid`); otherwise `null`.
          oneOf:
            - $ref: '#/components/schemas/Receipt'
            - type: 'null'
    Receipt:
      description: |
        PRD: Guarantees → Accuracy.

        How the session ended, chosen by `settlement`.
      oneOf:
        - $ref: '#/components/schemas/PaypalReceipt'
        - $ref: '#/components/schemas/RegisterReceipt'
        - $ref: '#/components/schemas/OutsideReceipt'
        - $ref: '#/components/schemas/UnpaidReceipt'
      discriminator:
        propertyName: settlement
        mapping:
          paypal: '#/components/schemas/PaypalReceipt'
          register: '#/components/schemas/RegisterReceipt'
          outside: '#/components/schemas/OutsideReceipt'
          unpaid: '#/components/schemas/UnpaidReceipt'
    ReceiptBase:
      type: object
      required: [settlement, orders_total, cover_charge, total, ended_at]
      properties:
        settlement:
          type: string
          enum: [paypal, register, outside, unpaid]
        orders_total:
          $ref: '#/components/schemas/Total'
        cover_charge:
          $ref: '#/components/schemas/Total'
        total:
          $ref: '#/components/schemas/Total'
        ended_at:
          type: string
          format: date-time
    PaypalReceipt:
      description: Checked out through BarPay; the amount charged equals `total`.
      allOf:
        - $ref: '#/components/schemas/ReceiptBase'
        - type: object
          required: [paypal_capture_id]
          properties:
            settlement:
              const: paypal
            paypal_capture_id:
              description: '`null` only when `total` was 0 and nothing was charged.'
              oneOf:
                - type: string
                  maxLength: 64
                - type: 'null'
      unevaluatedProperties: false
    RegisterReceipt:
      description: Staff recorded a payment at the register; nothing was charged through BarPay. `amount_recorded` may differ from `total`.
      allOf:
        - $ref: '#/components/schemas/ReceiptBase'
        - type: object
          required: [amount_recorded]
          properties:
            settlement:
              const: register
            amount_recorded:
              $ref: '#/components/schemas/Total'
      unevaluatedProperties: false
    OutsideReceipt:
      description: Staff settled a failed charge outside BarPay; nothing was charged through BarPay. `amount_recorded` may differ from `total`.
      allOf:
        - $ref: '#/components/schemas/ReceiptBase'
        - type: object
          required: [amount_recorded]
          properties:
            settlement:
              const: outside
            amount_recorded:
              $ref: '#/components/schemas/Total'
      unevaluatedProperties: false
    UnpaidReceipt:
      description: Closed as unpaid; nothing was collected through BarPay.
      allOf:
        - $ref: '#/components/schemas/ReceiptBase'
        - type: object
          required: [unpaid_amount]
          properties:
            settlement:
              const: unpaid
            unpaid_amount:
              $ref: '#/components/schemas/Total'
      unevaluatedProperties: false
    OrderLine:
      type: object
      additionalProperties: false
      required: [name, quantity, unit_price]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        quantity:
          type: integer
          minimum: 1
          maximum: 99
        unit_price:
          $ref: '#/components/schemas/Money'
    OrderRequest:
      type: object
      additionalProperties: false
      required: [order_id, lines]
      properties:
        order_id:
          description: The store app's order ID; unique within the session.
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9_.:-]+$'
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/OrderLine'
    Order:
      type: object
      additionalProperties: false
      required: [order_id, lines, amount, recorded_at]
      properties:
        order_id:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        amount:
          description: The sum of `quantity` × `unit_price` over the lines.
          $ref: '#/components/schemas/Total'
        recorded_at:
          type: string
          format: date-time
    Member:
      type: object
      additionalProperties: false
      required: [member_id, saved_paypal]
      properties:
        member_id:
          $ref: '#/components/schemas/MemberId'
        saved_paypal:
          description: '`null` when BarPay keeps no saved PayPal for this member.'
          oneOf:
            - $ref: '#/components/schemas/SavedPaypal'
            - type: 'null'
    SavedPaypal:
      type: object
      description: A reference to the member's saved PayPal. BarPay never exposes PayPal's token.
      additionalProperties: false
      required: [status, saved_at, consent_version, in_use_by_session_id]
      properties:
        status:
          type: string
          enum: [saved, deletion_pending]
        saved_at:
          type: string
          format: date-time
        consent_version:
          description: The version of the consent text the store app showed before linking (PRD Guarantees → Consent).
          $ref: '#/components/schemas/ConsentVersion'
        in_use_by_session_id:
          description: A session that uses it and is not yet closed, which blocks deletion; otherwise `null`.
          oneOf:
            - $ref: '#/components/schemas/SessionId'
            - type: 'null'
    PaypalLinkRequest:
      type: object
      additionalProperties: false
      required: [return_url, consent_version, state]
      properties:
        state:
          description: A value the store app binds to the member's browser session; echoed on the return.
          $ref: '#/components/schemas/PaypalLinkState'
        consent_version:
          description: The version of the consent text the store app showed to the member and the member agreed to.
          $ref: '#/components/schemas/ConsentVersion'
        return_url:
          description: Where BarPay sends the member back. Must be on the store app's origin set in the config file.
          type: string
          format: uri
          maxLength: 2048
    PaypalLink:
      type: object
      additionalProperties: false
      required: [link_url, expires_at]
      properties:
        link_url:
          description: A BarPay URL that redirects to PayPal. Open it as a full page, never embedded.
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    PaypalLinkResult:
      type: string
      description: |
        The `paypal_link` query parameter on the return URL (PRD: UC2).
        `approved`: PayPal approved; `code` is present and nothing is saved
        until `confirmPaypalLink`. `cancelled`: the member cancelled in
        PayPal. `failed`: PayPal did not approve. `expired`: the link URL was
        no longer valid. Nothing was saved in any case.
      enum: [approved, cancelled, failed, expired]
    PaypalLinkState:
      type: string
      description: The store app's own unguessable value, tied to the browser session that asked for the link.
      minLength: 16
      maxLength: 128
      pattern: '^[A-Za-z0-9_.:-]+$'
    ConsentVersion:
      type: string
      description: The store app's own identifier for a version of its consent text.
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9_.:-]+$'
    PaypalLinkCode:
      type: string
      description: A one-time code that works once and for 10 minutes.
      pattern: '^plc_[A-Za-z0-9]{32,64}$'
    PaypalLinkConfirmRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          $ref: '#/components/schemas/PaypalLinkCode'
    ExitToken:
      type: object
      additionalProperties: false
      required: [token, expires_at]
      properties:
        token:
          description: The value to encode in the QR. Opaque; works only at the exit gate.
          type: string
          minLength: 16
          maxLength: 128
        expires_at:
          description: When this token stops working. For an active session the next one is issued then; for a closed session it is the end of the re-unlock window.
          type: string
          format: date-time
    RatePoint:
      type: object
      description: |
        PRD: Pricing model.

        A published rate. `change` is the difference from the rate published
        before it, and 0 for the first rate in the store's currency (on the
        first start, and after a currency change).
      additionalProperties: false
      required: [rate_per_hour, change, published_at]
      properties:
        rate_per_hour:
          $ref: '#/components/schemas/Money'
        change:
          $ref: '#/components/schemas/SignedMoney'
        published_at:
          type: string
          format: date-time
    RateEvaluation:
      type: object
      additionalProperties: false
      required: [rate, evaluated, fallback]
      properties:
        rate:
          description: The rate published after this request.
          $ref: '#/components/schemas/RatePoint'
        evaluated:
          description: '`true` when an evaluation ran for this request or one already running was joined; `false` when the request came sooner than the minimum interval after the last evaluation started (one that fell back included) and no evaluation ran.'
          type: boolean
        fallback:
          description: |
            Set when an evaluation ran but the rate was kept:
            `ai_timeout` (no answer in time, including an AI that cannot be
            reached) or `ai_unreadable` (the answer could not be read as a
            rate, including an HTTP error from the AI). Otherwise `null`.
          oneOf:
            - type: string
              enum: [ai_timeout, ai_unreadable]
            - type: 'null'
    SignedMoney:
      type: object
      description: Like `Money`, but the value may be negative.
      required: [value, currency]
      additionalProperties: false
      properties:
        value:
          type: integer
          minimum: -100000000
          maximum: 100000000
        currency:
          $ref: '#/components/schemas/Currency'
    NextCursor:
      description: |
        Pass as `cursor` for the next page; `null` on the last page. It
        points at the last item of this page, so the next page holds the
        items listed after it whatever was added since (see the `Cursor`
        parameter).
      oneOf:
        - type: string
          maxLength: 256
        - type: 'null'
    AmountRecordedRequest:
      type: object
      additionalProperties: false
      required: [amount_recorded]
      properties:
        amount_recorded:
          description: The amount staff took. It may differ from the total.
          $ref: '#/components/schemas/Total'
    Settings:
      type: object
      description: |
        PRD: Pricing model; UC7 alternative flow (staff change a setting).

        Required: `floor` above 0 and below `ceiling`, `floor` and `ceiling`
        multiples of the currency's rate step (USD: 5 cents, so that a rate
        on the step always lies between them), `block_minutes` at least 1,
        `pause_minutes` and `cap_per_visit` 0 or more (0 turns them off).
      additionalProperties: false
      required: [floor, ceiling, block_minutes, pause_minutes, cap_per_visit, goal]
      properties:
        floor:
          description: The lowest rate per hour.
          $ref: '#/components/schemas/Money'
        ceiling:
          description: The highest rate per hour.
          $ref: '#/components/schemas/Money'
        block_minutes:
          type: integer
          minimum: 1
          maximum: 240
        pause_minutes:
          type: integer
          minimum: 0
          maximum: 240
        cap_per_visit:
          description: The most cover charge one visit can reach; orders do not count toward it.
          $ref: '#/components/schemas/Money'
        goal:
          description: 0 is "fill the room", 100 is "maximize revenue".
          type: integer
          minimum: 0
          maximum: 100
    StaffEvent:
      type: object
      additionalProperties: false
      required: [label, phase]
      properties:
        label:
          description: What happens, in plain English (e.g. "Live show").
          type: string
          minLength: 1
          maxLength: 100
        phase:
          type: string
          enum: [starts, ends]
        recorded_at:
          description: Set by BarPay in the response.
          type: string
          format: date-time
          readOnly: true
    Decision:
      type: object
      description: |
        PRD: Pricing model → Explanation, Decision log, Fallback.
      additionalProperties: false
      required: [decided_at, trigger, inputs, proposal, reasoning, published, explanation, fallback]
      properties:
        decided_at:
          type: string
          format: date-time
        trigger:
          description: '`evaluation` (requested by the store app) or `range_change` (the owner moved the floor or ceiling).'
          type: string
          enum: [evaluation, range_change]
        staff_id:
          description: The staff member, for `range_change`.
          type: string
          maxLength: 64
        inputs:
          description: The signals and goal the evaluation used; `null` for `range_change`, which uses none.
          oneOf:
            - type: object
              additionalProperties: false
              required: [occupancy, liveliness, staff_events, goal]
              properties:
                occupancy:
                  description: Active sessions divided by capacity, at most 1.
                  type: number
                  minimum: 0
                  maximum: 1
                liveliness:
                  description: The latest liveliness signal, 0–1; `null` if none.
                  oneOf:
                    - type: number
                      minimum: 0
                      maximum: 1
                    - type: 'null'
                staff_events:
                  type: array
                  items:
                    type: string
                    maxLength: 100
                goal:
                  type: integer
                  minimum: 0
                  maximum: 100
            - type: 'null'
        proposal:
          description: The AI's proposed rate before the guardrails; `null` on fallback or for `range_change`.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        reasoning:
          description: The AI's reasoning; `null` on fallback or for `range_change`.
          oneOf:
            - type: string
              maxLength: 4000
            - type: 'null'
        published:
          $ref: '#/components/schemas/RatePoint'
        explanation:
          description: |
            The short reason for the published change, after clamping. For
            `range_change`, BarPay writes it from the change; no AI takes part.
          type: string
          maxLength: 200
        fallback:
          description: |
            Set when the evaluation kept the rate: `ai_timeout` (no answer
            in time, including an AI that cannot be reached) or
            `ai_unreadable` (the answer could not be read as a rate,
            including an HTTP error from the AI). `null` otherwise and for
            `range_change`.
          oneOf:
            - type: string
              enum: [ai_timeout, ai_unreadable]
            - type: 'null'
    Alert:
      type: object
      description: 'PRD: Guarantees → Observability.'
      additionalProperties: false
      required: [id, kind, raised_at, message]
      properties:
        id:
          type: string
          pattern: '^alt_[A-Za-z0-9]{16,32}$'
        kind:
          type: string
          enum:
            - payment_failed
            - charge_unconfirmed
            - unlock_failed
            - register_requested
            - late_order_rejected
            - max_stay_reached
            - notification_given_up
            - deletion_failing
            - currency_change_pending
        raised_at:
          type: string
          format: date-time
        session_id:
          $ref: '#/components/schemas/SessionId'
        member_id:
          $ref: '#/components/schemas/MemberId'
        message:
          description: For staff, in English.
          type: string
          maxLength: 500
    NotificationRecord:
      type: object
      additionalProperties: false
      required: [event_id, type, status, attempts, created_at, last_attempt_at]
      properties:
        event_id:
          type: string
          pattern: '^evt_[A-Za-z0-9]{16,32}$'
        type:
          type: string
        status:
          description: |
            `retrying` from when the event is stored, before its first
            attempt too, until the store app acknowledges it (`delivered`) or
            the last retry is not acknowledged (`given_up`).
          type: string
          enum: [delivered, retrying, given_up]
        attempts:
          description: Attempts made so far; 0 before the first one.
          type: integer
          minimum: 0
        created_at:
          description: When the event was stored; its `created_at`.
          type: string
          format: date-time
        last_attempt_at:
          description: '`null` before the first attempt.'
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    EventBase:
      type: object
      description: |
        PRD: Responsibilities → Notifications.

        Every notification. `sequence` increases by one per subject (the
        session for `session.*` and `gate.*`, the member for `member.*`)
        and starts at 1.
      required: [id, type, created_at, sequence]
      properties:
        id:
          description: The event ID; the same across retries.
          type: string
          pattern: '^evt_[A-Za-z0-9]{16,32}$'
        type:
          type: string
        created_at:
          type: string
          format: date-time
        sequence:
          type: integer
          minimum: 1
    SessionStartedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [data]
          properties:
            type:
              const: session.started
            data:
              type: object
              additionalProperties: false
              required: [session]
              properties:
                session:
                  description: The session as of this event.
                  allOf:
                    - $ref: '#/components/schemas/Session'
                    - type: object
                      properties:
                        state:
                          const: active
    SessionPaypalLinkedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [data]
          properties:
            type:
              const: session.paypal_linked
            data:
              type: object
              additionalProperties: false
              required: [session]
              properties:
                session:
                  description: The session as of this event.
                  allOf:
                    - $ref: '#/components/schemas/Session'
                    - type: object
                      properties:
                        payment_method:
                          const: paypal
    SessionRegisterRequestedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [data]
          properties:
            type:
              const: session.register_requested
            data:
              type: object
              additionalProperties: false
              required: [session]
              properties:
                session:
                  description: The session as of this event.
                  allOf:
                    - $ref: '#/components/schemas/Session'
                    - type: object
                      properties:
                        state:
                          const: at_register
                        payment_method:
                          const: register
    SessionClosedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [data]
          properties:
            type:
              const: session.closed
            data:
              type: object
              additionalProperties: false
              required: [session]
              properties:
                session:
                  description: The session as of this event.
                  allOf:
                    - $ref: '#/components/schemas/Session'
                    - type: object
                      properties:
                        state:
                          const: closed
                        receipt:
                          $ref: '#/components/schemas/PaypalReceipt'
    SessionPaymentFailedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [data]
          properties:
            type:
              const: session.payment_failed
            data:
              type: object
              additionalProperties: false
              required: [session, reason]
              properties:
                reason:
                  description: |
                    `refused`: PayPal refused or failed the charge.
                    `unconfirmed`: BarPay could not confirm the outcome and
                    raised a `charge_unconfirmed` alert; the charge may have
                    gone through (PRD: UC5, UC7).
                  type: string
                  enum: [refused, unconfirmed]
                session:
                  description: The session as of this event.
                  allOf:
                    - $ref: '#/components/schemas/Session'
                    - type: object
                      properties:
                        state:
                          const: payment_failed
                        unpaid_amount:
                          $ref: '#/components/schemas/Total'
    SessionSettledOutsideEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [data]
          properties:
            type:
              const: session.settled_outside
            data:
              type: object
              additionalProperties: false
              required: [session]
              properties:
                session:
                  description: The session as of this event.
                  allOf:
                    - $ref: '#/components/schemas/Session'
                    - type: object
                      properties:
                        state:
                          const: closed
                        receipt:
                          oneOf:
                            - $ref: '#/components/schemas/RegisterReceipt'
                            - $ref: '#/components/schemas/OutsideReceipt'
    SessionClosedUnpaidEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [data]
          properties:
            type:
              const: session.closed_unpaid
            data:
              type: object
              additionalProperties: false
              required: [session]
              properties:
                session:
                  description: The session as of this event.
                  allOf:
                    - $ref: '#/components/schemas/Session'
                    - type: object
                      properties:
                        state:
                          const: closed_unpaid
                        receipt:
                          $ref: '#/components/schemas/UnpaidReceipt'
    GateUnlockFailedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [data]
          properties:
            type:
              const: gate.unlock_failed
            data:
              type: object
              additionalProperties: false
              required: [session]
              properties:
                session:
                  description: The session as of this event.
                  allOf:
                    - $ref: '#/components/schemas/Session'
                    - type: object
                      properties:
                        state:
                          const: closed
    MemberPaypalLinkedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [data]
          properties:
            type:
              const: member.paypal_linked
            data:
              type: object
              additionalProperties: false
              required: [member]
              properties:
                member:
                  description: The member as of this event.
                  $ref: '#/components/schemas/Member'
    MemberSavedPaypalDeletedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [data]
          properties:
            type:
              const: member.saved_paypal_deleted
            data:
              type: object
              additionalProperties: false
              required: [member, reason]
              properties:
                member:
                  description: The member as of this event; `saved_paypal` is `null`.
                  $ref: '#/components/schemas/Member'
                reason:
                  description: '`member_request` (UC9) or `no_longer_valid` (PayPal no longer has it: UC1 exception, UC5).'
                  type: string
                  enum: [member_request, no_longer_valid]
    Error:
      type: object
      description: Every error response.
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - unauthorized
                - session_not_found
                - session_not_active
                - order_conflict
                - currency_mismatch
                - amount_too_large
                - member_has_open_session
                - idempotency_key_reused
                - idempotency_key_in_progress
                - saved_paypal_exists
                - paypal_account_already_linked
                - saved_paypal_not_found
                - saved_paypal_in_use
                - return_url_not_allowed
                - link_code_invalid
                - paypal_save_failed
                - exit_token_unavailable
                - session_not_linked
                - session_not_payment_failed
                - session_not_at_register
                - retry_window_over
                - invalid_settings
                - gate_unavailable
            message:
              description: For developers; not shown to customers.
              type: string
            details:
              type: object
              additionalProperties: false
              properties:
                field:
                  type: string
                session_id:
                  $ref: '#/components/schemas/SessionId'
