name: Bilingual docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: arc-runner-barpay
    steps:
      # The script lists files with git ls-files, so checkout must fetch with git.
      - name: Install git if missing
        run: command -v git >/dev/null || { sudo apt-get update && sudo apt-get install -y git; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/check-bilingual-docs.sh
