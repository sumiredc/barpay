name: "[CI] Backend"

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: arc-runner-barpay
    steps:
      # The formatting step lists files with git ls-files, so checkout must fetch with git.
      - name: Install git if missing
        run: command -v git >/dev/null || { sudo apt-get update && sudo apt-get install -y git; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      - name: Test
        run: go test -race ./...
      # Tracked files only, so new packages are covered without editing this step; examples/ holds
      # separate modules. gofmt -l exits 0 even when it lists files, so its output decides.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go' ':!:examples/'))
          if [ -n "$unformatted" ]; then
            echo "Not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Check go.mod is tidy
        run: go mod tidy -diff
      # The development tools stay out of the production build and reach BarPay only over HTTP.
      # A failing go list fails the step too, so a broken build does not pass with nothing checked.
      - name: Check the development tools are not in the server's build
        run: |
          deps=$(go list -deps ./cmd/barpay) || exit 1
          if printf '%s\n' "$deps" | grep -F 'github.com/sumiredc/barpay/cmd/barpay-dev'; then exit 1; fi
          dev_deps=$(go list -deps ./cmd/barpay-dev/...) || exit 1
          if printf '%s\n' "$dev_deps" | grep -F 'github.com/sumiredc/barpay/internal/'; then exit 1; fi
