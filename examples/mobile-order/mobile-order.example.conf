# The sample app's config file. Copy it to mobile-order.conf, which git ignores, and fill in every
# empty value. Lines are "key = value"; every key is required.

# Where the app listens, and the app as the customer's browser opens it. BarPay's
# store_app_origin is this URL, and its notifications.url is this URL + /barpay/notifications.
listen_address = 127.0.0.1:3000
public_url = http://127.0.0.1:3000

# Members, browser sessions, orders and the notifications received. Git ignores this name.
data_path = mobile-order-data.json

store_name = The Copper Fox

# BarPay's base URL, and the three values its config file holds for the store app:
# keys.store_api_key, keys.admin_api_key and notifications.signing_secret.
barpay_url = http://127.0.0.1:8080
store_api_key =
admin_api_key =
notification_signing_secret =

# A staff account for the admin screen: "staff = <staff ID> <password hash>". The staff ID is
# what BarPay records with each admin request. Print a hash with:
#   go run . hash-password
# Repeat the line for more staff.
staff =
