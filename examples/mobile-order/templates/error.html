{{define "content"}}
{{template "notices" .}}
<div class="state bad">
  <i data-icon="alert"></i>
  <h1>{{.Data.Title}}</h1>
  {{with .Data.Text}}<p>{{.}}</p>{{end}}
</div>
{{end}}
{{define "cartbar"}}
{{- with .Data}}{{if .Post -}}
<form method="post" action="{{.Href}}"><input type="hidden" name="csrf" value="{{$.CSRF}}"><button class="button" type="submit" style="justify-content: center"><i data-icon="rotate-cw"></i> {{.Button}}</button></form>
{{- else -}}
<a class="button" href="{{.Href}}" style="justify-content: center">{{.Button}}</a>
{{- end}}{{end -}}
{{end}}
