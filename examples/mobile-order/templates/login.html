{{define "content"}}
<h1>Log in</h1>
{{template "notices" .}}
<form class="card" id="login-form" method="post" action="/login">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email">
  <label for="password">Password</label>
  <div class="password"><input id="password" name="password" type="password" required autocomplete="current-password"><button type="button"></button></div>
</form>
<p>New here? <a href="/signup">Sign up</a></p>
{{end}}
{{define "cartbar"}}<button class="button" type="submit" form="login-form" style="justify-content: center">Log in</button>{{end}}
