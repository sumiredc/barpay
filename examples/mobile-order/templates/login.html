{{define "content"}}
<h1>Log in</h1>
{{template "notices" .}}
{{if .Data.KeepsVisit}}<p class="notice info"><i data-icon="info"></i><span>Your current visit carries over to your account</span></p>{{end}}
<form class="form" id="login-form" method="post" action="/login">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" required autocomplete="email"{{with .Data.Email}} value="{{.}}"{{end}}>
  <label for="password">Password</label>
  <div class="password"><input id="password" name="password" type="password" required autocomplete="current-password"><button type="button"></button></div>
</form>
<p class="switch">New here? <a href="/signup">Sign up</a></p>
{{end}}
{{define "cartbar"}}<button class="button" type="submit" form="login-form" style="justify-content: center">Log in</button>{{end}}
