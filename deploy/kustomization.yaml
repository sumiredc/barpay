apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# BarPay, the sample app and the signal simulator in one Pod, reached at barpay-demo.sumire.pink.
# README.md (Running on Kubernetes) says how to make the Secret and in which order to add things.
namespace: barpay

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - pvc.yaml
  # The SealedSecret barpay-demo, which you seal yourself.
  - sealed-secret.yaml

images:
  - name: 10.1.1.10:5000/barpay/demo
    # Commit a45569080dc8fc722007125613a673a4efe2ab79. The digest, from the summary of the run that
    # pushed the image, decides what runs: a tag in the registry can be overwritten. To roll out
    # another image, change the digest and this commit in a pull request.
    digest: sha256:8e71a57d815a89d904e918df58f4d268f53a0aaffc9d1deb7101cf23d9274c16
