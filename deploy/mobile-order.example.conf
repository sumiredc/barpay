# The sample app's config file as it runs in the Pod, for the Secret barpay-demo. Copy it to
# deploy/mobile-order.conf, which git ignores, and fill in every empty value: they are the secrets.
# What each key takes is in examples/mobile-order/mobile-order.example.conf.

# Every interface, so the Service reaches the app.
listen_address = :3000
# BarPay's store_app_origin is this URL.
public_url = https://barpay-demo.sumire.pink

# On the volume. The app writes a temporary file in the same directory and renames it.
data_path = /data/mobile-order-data.json

store_name = The Copper Fox

# BarPay in the same Pod, and the three values barpay.toml holds for the store app:
# keys.store_api_key, keys.admin_api_key and notifications.signing_secret.
barpay_url = http://127.0.0.1:8080
store_api_key =
admin_api_key =
notification_signing_secret =

# "staff = <staff ID> <password hash>", the hash printed by hash-password. Repeat for more staff.
staff =
